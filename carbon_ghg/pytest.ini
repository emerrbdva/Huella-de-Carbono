[pytest]
# Configuración de pytest para carbon_ghg

# Directorio de pruebas
testpaths = tests

# Patrón de archivos de prueba
python_files = test_*.py

# Patrón de clases de prueba
python_classes = Test*

# Patrón de funciones de prueba
python_functions = test_*

# Opciones por defecto
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers personalizados
markers =
    slow: marca pruebas que tardan mucho tiempo
    integration: pruebas de integración
    unit: pruebas unitarias
    ai: pruebas que requieren Ollama

# Configuración de cobertura
[coverage:run]
source = .
omit =
    */tests/*
    */examples/*
    */__pycache__/*
    */venv/*
    */env/*
    setup.py

[coverage:report]
precision = 2
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
