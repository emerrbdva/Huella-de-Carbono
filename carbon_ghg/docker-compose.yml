version: '3.8'

services:
  # Servicio principal: Carbon GHG Calculator con Streamlit
  carbon-ghg-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon-ghg-streamlit
    ports:
      - "8501:8501"
    volumes:
      # Datos persistentes
      - ./data:/app/data:ro
      - ./reports:/app/reports:rw
      # Configuración
      - ./config:/app/config:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_THEME_PRIMARY_COLOR=#00A86B
      - STREAMLIT_THEME_BACKGROUND_COLOR=#FFFFFF
      - STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR=#F0F2F6
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - carbon-ghg-network
    labels:
      - "com.carbon-ghg.description=Carbon GHG Calculator - Streamlit App"
      - "com.carbon-ghg.version=1.0"

  # Servicio opcional: Ollama para IA local (si está disponible)
  ollama:
    image: ollama/ollama:latest
    container_name: carbon-ghg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    networks:
      - carbon-ghg-network
    profiles:
      - with-ai  # Solo se inicia si se especifica el perfil
    labels:
      - "com.carbon-ghg.description=Ollama AI Service for Carbon GHG"
      - "com.carbon-ghg.version=1.0"

networks:
  carbon-ghg-network:
    driver: bridge
    name: carbon-ghg-net

volumes:
  ollama-data:
    driver: local
    name: carbon-ghg-ollama-data
